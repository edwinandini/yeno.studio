media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      primary: title
      fields: [published, cover, title, date, author]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: layout, type: string, hidden: true, default: post }
      - { name: title, label: Article title, type: string, required: true }
      - { name: description, label: Meta description, type: text, required: true, description: "A clear 120–160 character summary for Google and social previews." }
      - { name: seo_title, label: SEO title, type: string, description: "Optional. Leave blank to use the article title." }
      - { name: date, label: Publish date, type: date, options: { time: false }, required: true }
      - { name: author, label: Author, type: string, required: true, default: "yeno.studio" }
      - { name: published, label: Published, type: boolean, default: false, description: "Keep off while drafting. Turn on when the article is ready to go live." }
      - { name: category, label: Category, type: select, options: { values: [ "Product thinking", "Design & experience", "Development", "Campaigns & growth", "Studio notes" ] } }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: cover, label: Cover image, type: image }
      - { name: cover_alt, label: Cover image description, type: string, description: "Describe the image for accessibility and image search." }
      - { name: canonical_url, label: Canonical URL, type: string, description: "Usually blank. Use only if this article was first published elsewhere." }
      - { name: noindex, label: Hide from search engines, type: boolean, default: false }
      - { name: body, label: Article, type: rich-text, required: true }
